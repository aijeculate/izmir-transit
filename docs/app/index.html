<script>
  // Pick the theme before anything paints, so there is no light flash in dark mode.
  try {
    var s = JSON.parse(localStorage.getItem("izmir-transit") || "{}").theme || "system";
    var d = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = d ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
</script>
